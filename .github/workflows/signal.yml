name: signal
on:
  schedule:
    - cron: "40 23 * * 0-4"   # 午前の部 JST 8:40開始（月〜金）
    - cron: "20 3 * * 1-5"    # 午後の部 JST 12:20開始
  workflow_dispatch:
    inputs:
      test:
        description: "通知テスト"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: signal
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 230
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas requests
      - name: test
        if: ${{ inputs.test }}
        env:
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python stock_signal_notifier.py --test
      - name: watch
        if: ${{ !inputs.test }}
        env:
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: |
          H=$(TZ=Asia/Tokyo date +%H)
          if [ "$H" -lt 12 ]; then U=11:32; else U=15:32; fi
          python stock_signal_notifier.py --loop --interval 60 --until $U
      - name: save state
        if: always()
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add signal_state.json || true
          git diff --cached --quiet || (git commit -m "state" && git push) || true
