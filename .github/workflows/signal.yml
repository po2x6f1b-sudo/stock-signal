name: signal
on:
  schedule:
    - cron: "*/5 0-6 * * 1-5"
  workflow_dispatch:
    inputs:
      test:
        description: "通知テスト"
        type: boolean
        default: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas requests
      - run: python stock_signal_notifier.py ${{ inputs.test && '--test' || '' }}
        env:
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
